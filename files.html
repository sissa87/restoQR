<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سورس كود المشروع - الشواية السطايفية</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen pb-20">

<main class="max-w-7xl mx-auto p-4 lg:p-8 space-y-6">
  <div class="card p-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
    <div>
      <span class="px-2.5 py-0.5 bg-emerald-500/20 text-emerald-300 text-xs font-bold rounded-md border border-emerald-500/30">HTML5 + CSS3 + Vanilla JS + Supabase SQL</span>
      <h2 class="text-xl font-bold text-white flex items-center gap-2 mt-1.5">💻 تصفح وتحميل ملفات المشروع الفعلية</h2>
      <p class="text-xs text-slate-400 mt-1">كود صريح يعمل مباشرة في المتصفح مع Supabase - اضغط تحميل ZIP للحصول على الحزمة كاملة</p>
    </div>
    <button id="downloadZipBtn" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl transition shrink-0">⬇️ تحميل حزمة Zip كاملة</button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-12 gap-6 h-[calc(100vh-260px)] min-h-[500px]">
    <div class="md:col-span-4 card flex flex-col overflow-hidden">
      <div class="p-3 border-b border-slate-800 space-y-2 bg-slate-950/50">
        <input id="searchInput" placeholder="🔍 بحث في ملفات المشروع..." class="bg-transparent w-full text-xs text-slate-200 focus:outline-none px-1">
        <div class="flex gap-1 overflow-x-auto pb-1" id="categoryFilters"></div>
      </div>
      <div class="flex-1 overflow-y-auto p-2 space-y-1" id="filesList"></div>
    </div>

    <div class="md:col-span-8 card flex flex-col overflow-hidden">
      <div class="p-3 border-b border-slate-800 bg-slate-950/80 flex items-center justify-between gap-2">
        <div><div id="selectedFilePath" class="font-mono text-xs text-amber-300 font-bold" dir="ltr"></div></div>
        <div class="flex items-center gap-2">
          <button id="downloadFileBtn" class="px-3 py-1.5 bg-emerald-600/20 border border-emerald-500/40 hover:bg-emerald-600 hover:text-white text-emerald-300 text-xs font-bold rounded-lg transition">⬇️ تحميل الملف</button>
          <button id="copyFileBtn" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs rounded-lg transition">📋 نسخ الكود</button>
        </div>
      </div>
      <div class="flex-1 p-4 bg-slate-950 overflow-auto font-mono text-xs text-slate-200 leading-relaxed" dir="ltr">
        <pre id="codeView">جاري التحميل...</pre>
      </div>
    </div>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/nav.js"></script>
<script>
renderNav('files.html');
renderFooter();

const PROJECT_FILES = [
  { path: 'index.html', category: 'html', description: 'الصفحة الرئيسية - مركز التنقل' },
  { path: 'menu.html', category: 'html', description: 'قائمة الزبون والطلب + جلسة QR' },
  { path: 'kitchen.html', category: 'html', description: 'شاشة المطبخ (KDS)' },
  { path: 'cashier.html', category: 'html', description: 'الكاشير والمحاسبة' },
  { path: 'admin.html', category: 'html', description: 'لوحة تحكم الآدمن' },
  { path: 'manager.html', category: 'html', description: 'لوحة تحكم المسير (موظفون، قائمة وأصناف، أرشيف طلبات)' },
  { path: 'monitor.html', category: 'html', description: 'مراقب القاعة والانتظار' },
  { path: 'hall-tv.html', category: 'html', description: 'شاشة القاعة الحية (TV)' },
  { path: 'delivery.html', category: 'html', description: 'التوصيل والديليفري' },
  { path: 'reservations.html', category: 'html', description: 'الحجز المسبق' },
  { path: 'guardian.html', category: 'html', description: 'مختبر أمان الجلسات' },
  { path: 'files.html', category: 'html', description: 'هذه الصفحة - متصفح الكود' },
  { path: 'css/style.css', category: 'css', description: 'تنسيقات مشتركة إضافية' },
  { path: 'js/config.js', category: 'js', description: 'إعدادات اتصال Supabase' },
  { path: 'js/supabase-client.js', category: 'js', description: 'عميل Supabase وأدوات CRUD' },
  { path: 'js/state-machine.js', category: 'js', description: 'محرك آلة الحالات' },
  { path: 'js/qr-engine.js', category: 'js', description: 'محرك أمان QR' },
  { path: 'js/nav.js', category: 'js', description: 'شريط التنقل الموحد' },
  { path: 'sql/schema.sql', category: 'sql', description: 'قاعدة بيانات Supabase الكاملة' },
  { path: 'sql/reset.sql', category: 'sql', description: 'سكريبت تنظيف كامل لإعادة البناء' }
];

let selectedPath = PROJECT_FILES[0].path, searchQuery = '', activeCat = 'all', fileCache = {};

document.getElementById('categoryFilters').innerHTML = ['all','html','css','js','sql'].map(cat => `
  <button data-cat="${cat}" class="cat-filter-btn px-3 py-1 rounded text-xs font-mono font-bold transition uppercase ${cat==='all' ? 'bg-amber-600 text-white' : 'bg-slate-800 text-slate-400'}">
    ${cat === 'sql' ? '🗄️ SQL' : cat === 'html' ? '🌐 HTML' : cat === 'css' ? '🎨 CSS' : cat === 'js' ? '⚡ JS' : 'الكل'}
  </button>`).join('');

document.getElementById('categoryFilters').addEventListener('click', (e) => {
  const b = e.target.closest('.cat-filter-btn'); if (!b) return;
  activeCat = b.dataset.cat;
  document.querySelectorAll('.cat-filter-btn').forEach(x => x.className = 'cat-filter-btn px-3 py-1 rounded text-xs font-mono font-bold transition uppercase bg-slate-800 text-slate-400');
  b.className = 'cat-filter-btn px-3 py-1 rounded text-xs font-mono font-bold transition uppercase bg-amber-600 text-white';
  renderList();
});

document.getElementById('searchInput').addEventListener('input', (e) => { searchQuery = e.target.value.toLowerCase(); renderList(); });

function renderList() {
  const filtered = PROJECT_FILES.filter(f => (activeCat === 'all' || f.category === activeCat) && (f.path.toLowerCase().includes(searchQuery) || f.description.includes(searchQuery)));
  document.getElementById('filesList').innerHTML = filtered.map(f => `
    <button data-path="${f.path}" class="file-btn w-full text-right p-3 rounded-xl text-xs font-mono transition ${selectedPath === f.path ? 'bg-amber-600/20 text-amber-300 border border-amber-500/30' : 'text-slate-300 hover:bg-slate-800/60'}">
      <div class="font-bold truncate" dir="ltr">📄 ${f.path}</div>
      <div class="text-[11px] text-slate-400 truncate" style="font-family:'Tajawal'">${f.description}</div>
    </button>`).join('');
  document.querySelectorAll('.file-btn').forEach(b => b.onclick = () => selectFile(b.dataset.path));
}

async function selectFile(path) {
  selectedPath = path;
  renderList();
  document.getElementById('selectedFilePath').textContent = path;
  document.getElementById('codeView').textContent = 'جاري التحميل...';
  if (!fileCache[path]) {
    try { fileCache[path] = await (await fetch(path)).text(); } catch (e) { fileCache[path] = '// تعذر تحميل الملف'; }
  }
  document.getElementById('codeView').textContent = fileCache[path];
}

document.getElementById('downloadFileBtn').onclick = () => {
  const content = fileCache[selectedPath] || '';
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  saveAs(blob, selectedPath.split('/').pop());
};

document.getElementById('copyFileBtn').onclick = () => {
  navigator.clipboard.writeText(fileCache[selectedPath] || '');
  const btn = document.getElementById('copyFileBtn');
  btn.textContent = '✅ تم النسخ!';
  setTimeout(() => btn.textContent = '📋 نسخ الكود', 1500);
};

document.getElementById('downloadZipBtn').onclick = async () => {
  const btn = document.getElementById('downloadZipBtn');
  btn.textContent = '⏳ جاري التحضير...'; btn.disabled = true;
  try {
    const zip = new JSZip();
    for (const f of PROJECT_FILES) {
      const content = fileCache[f.path] || await (await fetch(f.path)).text();
      zip.file(f.path, content);
    }
    const blob = await zip.generateAsync({ type: 'blob' });
    saveAs(blob, 'chwaya-staifi-v1.0-restaurant-site.zip');
  } catch (e) {
    showToast('حدث خطأ أثناء تحضير الحزمة', 'error');
  } finally {
    btn.textContent = '⬇️ تحميل حزمة Zip كاملة'; btn.disabled = false;
  }
};

renderList();
selectFile(selectedPath);
</script>
</body>
</html>
