<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التوصيل والديليفري - الشواية السطايفية</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen pb-20">

<main class="max-w-7xl mx-auto p-4 lg:p-8 space-y-6">
  <div class="card p-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
    <div class="flex items-center gap-3">
      <div class="p-3 bg-amber-500/20 text-amber-400 rounded-2xl border border-amber-500/30 text-xl">🚚</div>
      <div><h2 class="font-extrabold text-base text-white">التوصيل والديليفري (Delivery Management)</h2>
        <p class="text-xs text-slate-400">تسجيل الطلب، تأكيد الهاتف، إرسال للمطبخ وتسليم السائق</p></div>
    </div>
    <div class="flex items-center gap-1.5 bg-slate-950 p-1.5 rounded-2xl border border-slate-800" id="deliveryTabs">
      <button data-tab="customer" class="dtab-btn px-3 py-1.5 rounded-xl text-xs font-bold transition bg-amber-600 text-white">طلب توصيل زبون</button>
      <button data-tab="supervisor" class="dtab-btn px-3 py-1.5 rounded-xl text-xs font-bold transition text-slate-400">تأكيد الهاتف</button>
      <button data-tab="driver" class="dtab-btn px-3 py-1.5 rounded-xl text-xs font-bold transition text-slate-400">السائق والدفع</button>
    </div>
  </div>

  <div id="deliveryContent"></div>
</main>

<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/nav.js"></script>
<script>
renderNav('delivery.html');
renderFooter();

let activeDTab = 'customer', menuItems = [], orders = [], cart = [], deliveryFee = 300;

document.getElementById('deliveryTabs').addEventListener('click', (e) => {
  const b = e.target.closest('.dtab-btn'); if (!b) return;
  activeDTab = b.dataset.tab;
  document.querySelectorAll('.dtab-btn').forEach(x => x.className = 'dtab-btn px-3 py-1.5 rounded-xl text-xs font-bold transition text-slate-400');
  b.className = 'dtab-btn px-3 py-1.5 rounded-xl text-xs font-bold transition bg-amber-600 text-white';
  render();
});

function render() {
  const box = document.getElementById('deliveryContent');
  if (activeDTab === 'customer') box.innerHTML = customerTabHtml();
  else if (activeDTab === 'supervisor') box.innerHTML = supervisorTabHtml();
  else box.innerHTML = driverTabHtml();
  attachEvents();
}

function customerTabHtml() {
  const totalFood = cart.reduce((s, ci) => s + ci.item.price * ci.quantity, 0);
  const grandTotal = totalFood > 0 ? totalFood + deliveryFee : 0;
  return `<div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
    <div class="lg:col-span-7 space-y-3">
      <h3 class="font-bold text-sm text-white">🛍️ اختر الأطباق</h3>
      <div class="grid sm:grid-cols-2 gap-3 max-h-[65vh] overflow-y-auto pr-1">
        ${menuItems.map(m => `
          <div class="card overflow-hidden flex flex-col">
            <img src="${m.image}" class="h-28 w-full object-cover">
            <div class="p-3 flex flex-col gap-1.5 flex-1">
              <h4 class="font-bold text-xs text-white">${m.name}</h4>
              <div class="flex items-center justify-between mt-auto pt-1">
                <span class="font-mono font-extrabold text-amber-400 text-xs">${formatDA(m.price)}</span>
                <button data-id="${m.id}" class="add-cart-btn px-2.5 py-1 bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold text-[10px] rounded-lg">➕ أضف</button>
              </div>
            </div>
          </div>`).join('')}
      </div>
    </div>
    <div class="lg:col-span-5">
      <form id="deliveryForm" class="card p-5 space-y-3">
        <input id="dCustomerName" required placeholder="اسمك الكريم *" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
        <input id="dCustomerPhone" required placeholder="رقم الهاتف *" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
        <input id="dAddress" required placeholder="العنوان بالتفصيل *" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
        <div class="flex justify-between items-center">
          <label class="text-xs font-bold text-slate-300">موقع الـ GPS:</label>
          <button type="button" id="gpsBtn" class="text-[10px] text-amber-400 font-bold">📍 تحديد موقعي الآن</button>
        </div>
        <input id="dGps" placeholder="احداثيات GPS أو معلم بارز..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-amber-300 font-mono">

        <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-1.5 text-xs">
          <div class="font-bold text-white border-b border-slate-800 pb-1.5">الأطباق المختارة (${cart.length}):</div>
          ${cart.map((ci, i) => `<div class="flex justify-between text-slate-300"><span>${ci.quantity}x ${ci.item.name}</span><span class="font-mono text-amber-400">${formatDA(ci.item.price * ci.quantity)}</span></div>`).join('')}
          <div class="pt-1.5 border-t border-slate-800 space-y-1 text-slate-400 text-[11px]">
            <div class="flex justify-between"><span>ثمن الطعام:</span><span class="font-mono text-white">${formatDA(totalFood)}</span></div>
            <div class="flex justify-between"><span>رسوم التوصيل:</span><span class="font-mono text-amber-400">${formatDA(deliveryFee)}</span></div>
            <div class="flex justify-between font-extrabold text-white text-sm pt-1 border-t border-slate-800"><span>الإجمالي:</span><span class="font-mono text-emerald-400">${formatDA(grandTotal)}</span></div>
          </div>
        </div>
        <button type="submit" class="w-full py-3 bg-amber-600 hover:bg-amber-500 text-slate-950 font-black text-xs rounded-xl transition">📨 إرسال طلب التوصيل الآن</button>
      </form>
    </div>
  </div>`;
}

function supervisorTabHtml() {
  const deliveryOrders = orders.filter(o => o.dining_type === 'DELIVERY');
  return `<div class="card p-6 space-y-4">
    <div class="flex justify-between items-center border-b border-slate-800 pb-3">
      <h3 class="font-bold text-sm text-white">📞 طلبات بانتظار تأكيد الهاتف</h3>
      <div class="flex items-center gap-2 bg-slate-950 p-2 rounded-xl border border-slate-800 text-xs">
        <span class="text-slate-400 font-bold">تسعيرة التوصيل:</span>
        <input id="feeInput" type="number" value="${deliveryFee}" class="w-20 bg-slate-900 border border-slate-700 text-amber-400 font-bold font-mono px-2 py-1 rounded text-center">
      </div>
    </div>
    <div class="space-y-3">
      ${deliveryOrders.length ? deliveryOrders.map(o => `
        <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
          <div class="space-y-1">
            <div class="flex items-center gap-2"><span class="font-bold text-white text-sm">طلب #${o.order_number}</span><span class="px-2 py-0.5 rounded font-mono font-bold text-[10px] ${o.status==='SUBMITTED' ? 'bg-amber-500/20 text-amber-300' : 'bg-emerald-500/20 text-emerald-300'}">${o.status}</span></div>
            <div class="text-xs text-slate-300">الزبون: <span class="font-bold text-amber-300">${o.customer_name}</span> | الهاتف: <span class="font-mono text-emerald-400 font-bold">${o.customer_phone}</span></div>
            <div class="text-xs text-slate-400">${o.notes ?? ''}</div>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-lg font-black text-amber-400 font-mono">${formatDA(o.total_amount)}</span>
            ${o.status === 'SUBMITTED' ? `<button data-id="${o.id}" class="confirm-call-btn px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-black text-xs rounded-xl">📞 تأكيد ➔ للمطبخ</button>` : ''}
          </div>
        </div>`).join('') : `<div class="text-center py-12 text-slate-500 text-xs">لا توجد طلبات توصيل حالياً</div>`}
    </div>
  </div>`;
}

function driverTabHtml() {
  const deliveryOrders = orders.filter(o => o.dining_type === 'DELIVERY' && ['READY_FOR_DELIVERY','IN_PREPARATION','PAID'].includes(o.status));
  return `<div class="card p-6 space-y-4">
    <h3 class="font-bold text-sm text-white border-b border-slate-800 pb-3">🚚 تسليم السائق والمحاسبة الفورية</h3>
    <div class="space-y-3">
      ${deliveryOrders.length ? deliveryOrders.map(o => `
        <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex justify-between items-center text-xs">
          <div><div class="font-bold text-white text-sm">طلب #${o.order_number} - ${o.customer_name}</div>
            <div class="text-slate-400 mt-0.5">${o.customer_phone} | ${o.notes ?? ''}</div>
            <div class="text-amber-400 font-mono font-bold mt-1">${o.status}</div></div>
          <div class="flex items-center gap-3">
            <span class="text-lg font-black text-emerald-400 font-mono">${formatDA(o.total_amount)}</span>
            ${o.payment_status === 'UNPAID' ? `<button data-id="${o.id}" class="collect-btn px-4 py-2 bg-amber-600 hover:bg-amber-500 text-slate-950 font-black text-xs rounded-xl">تأكيد التحصيل (كاش)</button>` : `<span class="px-3 py-1 bg-emerald-500/20 text-emerald-300 font-bold rounded-xl border border-emerald-500/30">تم التحصيل ✓</span>`}
          </div>
        </div>`).join('') : `<div class="text-center py-12 text-slate-500 text-xs">لا توجد طلبات جاهزة للتسليم</div>`}
    </div>
  </div>`;
}

function attachEvents() {
  document.querySelectorAll('.add-cart-btn').forEach(b => b.onclick = () => {
    const item = menuItems.find(m => m.id === b.dataset.id);
    const existing = cart.find(c => c.item.id === item.id);
    if (existing) existing.quantity++; else cart.push({ item, quantity: 1 });
    render(); showToast('أُضيف للسلة', 'success');
  });
  const gpsBtn = document.getElementById('gpsBtn');
  if (gpsBtn) gpsBtn.onclick = () => {
    if (navigator.geolocation) navigator.geolocation.getCurrentPosition(
      pos => document.getElementById('dGps').value = `${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`,
      () => document.getElementById('dGps').value = '36.1911° N, 5.4137° E (سطيف - الجزائر)'
    );
  };
  const form = document.getElementById('deliveryForm');
  if (form) form.addEventListener('submit', submitDeliveryOrder);
  const feeInput = document.getElementById('feeInput');
  if (feeInput) feeInput.onchange = () => { deliveryFee = +feeInput.value || 0; };
  document.querySelectorAll('.confirm-call-btn').forEach(b => b.onclick = () => confirmCall(b.dataset.id));
  document.querySelectorAll('.collect-btn').forEach(b => b.onclick = () => collectPayment(b.dataset.id));
}

async function submitDeliveryOrder(e) {
  e.preventDefault();
  const name = document.getElementById('dCustomerName').value.trim();
  const phone = document.getElementById('dCustomerPhone').value.trim();
  const address = document.getElementById('dAddress').value.trim();
  if (!cart.length || !name || !phone || !address) { showToast('يرجى ملء البيانات واختيار طبق واحد على الأقل', 'error'); return; }

  const totalFood = cart.reduce((s, ci) => s + ci.item.price * ci.quantity, 0);
  const grandTotal = totalFood + deliveryFee;
  const { data: existingOrders } = await supabaseClient.from('orders').select('order_number').order('order_number', { ascending: false }).limit(1);
  const nextOrderNumber = (existingOrders && existingOrders[0] ? existingOrders[0].order_number : 100) + 1;

  const items = cart.map(ci => ({ id: genId('doi'), menuItemId: ci.item.id, name: ci.item.name, price: ci.item.price, quantity: ci.quantity, selectedAddons: [], kitchenStatus: 'QUEUED' }));

  await insertRow('orders', {
    order_number: nextOrderNumber, dining_type: 'DELIVERY', operating_mode: 'TAKEAWAY_DELIVERY', payment_policy: 'PAYMENT_FIRST',
    customer_name: name, customer_phone: phone, hall_name: 'طلب توصيل خارجي', items, total_amount: grandTotal,
    status: 'SUBMITTED', payment_status: 'UNPAID',
    notes: `رسوم التوصيل: ${deliveryFee} د.ج | العنوان: ${address} | GPS: ${document.getElementById('dGps').value || 'محدد تلفونياً'}`
  });
  await addNotification('طلب توصيل جديد 🚚', `طلب #${nextOrderNumber} من ${name}`, 'ALL', 'HIGH');
  showToast('تم إرسال طلب التوصيل بنجاح 🚚', 'success');
  cart = [];
  loadAll();
}

async function confirmCall(orderId) {
  // 🆕 دُمجت مرحلتا "استلام المطبخ" و"بانتظار التحضير" في خطوة واحدة (تسليم للمطبخ)
  await updateRow('orders', 'id', orderId, { status: 'IN_PREPARATION', updated_at: new Date().toISOString() });
  await addAuditLog('DELIVERY_CALL_CONFIRMED', 'WAITER', `تأكيد هاتف طلب التوصيل وتحويله للمطبخ`);
  showToast('تم التأكيد وتحويل الطلب للمطبخ', 'success');
  loadAll();
}

async function collectPayment(orderId) {
  await updateRow('orders', 'id', orderId, { status: 'COMPLETED', payment_status: 'PAID', payment_method: 'CASH', updated_at: new Date().toISOString() });
  await addAuditLog('DELIVERY_PAYMENT_COLLECTED', 'CASHIER', `تحصيل فاتورة توصيل`);
  showToast('تم تأكيد التحصيل ✅', 'success');
  loadAll();
}

async function loadAll() {
  menuItems = await fetchAll('menu_items', 'category');
  orders = await fetchAll('orders', 'created_at');
  render();
}
loadAll();
subscribeToTable('orders', loadAll);
</script>
</body>
</html>
