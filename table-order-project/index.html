<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">

<header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 lg:px-8 py-3.5">
  <div class="max-w-7xl mx-auto flex items-center gap-3">
    <div class="w-10 h-10 rounded-2xl bg-amber-600 flex items-center justify-center text-slate-950 shadow-lg shadow-amber-600/30 text-xl">🔥</div>
    <div>
      <h1 class="font-extrabold text-base text-white tracking-wide">Restaurant</h1>
      <p class="text-[11px] text-slate-400">chiffrement tables</p>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto p-6 lg:p-10">
  <div class="text-center mb-10">
    <span class="inline-block px-3 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/30 rounded-full text-xs font-bold mb-4">Systéme</span>
    <h2 class="text-3xl lg:text-4xl font-black text-white mb-3">choisir</h2>
    <p class="text-slate-400 max-w-xl mx-auto text-sm">roles</p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="roleGrid"></div>
</main>

<footer class="border-t border-slate-800 bg-slate-900 py-6 text-center text-xs text-slate-500 mt-10">
  <div class="max-w-7xl mx-auto px-4">Admin</div>
</footer>

<script>
const ROLES = [
  { href: 'menu.html', icon: '🍽️', title: 'الزبون والطلب (عبر QR)', desc: 'الزبون يمسح كود QR الخاص بطاولته من جهازه ويبدأ الطلب مباشرة', color: 'amber' },
  { href: 'screens.html', icon: '🖥️', title: 'الطلب من داخل المطعم', desc: 'تابلت/جهاز داخل القاعة: الموظف يختار طاولة جاهزة (خضراء) ويدخل جلسة طلب عليها مباشرة', color: 'amber' },
  { href: 'admin.html', icon: '🏢', title: 'الآدمن', desc: 'كل الصلاحيات: القائمة، الطاولات، الإعدادات وسجل QR', color: 'violet' },
  { href: 'manager.html', icon: '🗂️', title: 'المسير', desc: 'صلاحيات الموظفين + إدارة الأطباق والأصناف + أرشيف الطلبات اليومية', color: 'indigo' },
  { href: 'cashier.html', icon: '🧾', title: 'المحاسب', desc: 'محاسبة الطلبات وتحصيل المدفوعات', color: 'emerald' },
  { href: 'monitor.html', icon: '👥', title: 'مراقب القاعة والانتظار', desc: 'إدارة طابور الانتظار وحالة الطاولات', color: 'sky' },
 // الصفحات التالية غير مفهرَسة هنا بطلب صريح (تبقى الأدوات كاملة الوظائف وتعمل بدونها تماماً، يمكن فتحها مباشرة بالرابط عند الحاجة فقط):
 // { href: 'hall-tv.html', icon: '📺', title: 'شاشة القاعة (TV)', desc: 'عرض حي لاستدعاء الزبائن وحالة الطاولات', color: 'rose' },
 // { href: 'kitchen.html', icon: '🔥', title: 'المطبخ للشواية', desc: 'شاشة تحضير الطلبات (KDS) للطهاة', color: 'orange' },
 // { href: 'delivery.html', icon: '🚚', title: 'التوصيل والديليفري', desc: 'طلبات التوصيل والتيك أواي', color: 'lime' },
 // { href: 'reservations.html', icon: '📅', title: 'الحجز المسبق', desc: 'إدارة حجوزات الطاولات المسبقة', color: 'cyan' },
 // { href: 'guardian.html', icon: '🛡️', title: 'مختبر الأمان', desc: 'اختبار محرك أمان QR وسجلات المحاولات', color: 'red' },
 // { href: 'files.html', icon: '💻', title: 'سورس كود المشروع', desc: 'تصفح وتحميل ملفات المشروع كاملة (ZIP)', color: 'slate' }
];

document.getElementById('roleGrid').innerHTML = ROLES.map(r => `
  <a href="${r.href}" class="card p-5 hover:border-amber-500/50 hover:-translate-y-0.5 transition group block">
    <div class="w-12 h-12 rounded-xl bg-${r.color}-500/10 border border-${r.color}-500/30 flex items-center justify-center text-2xl mb-4">${r.icon}</div>
    <h3 class="font-extrabold text-white mb-1.5 group-hover:text-amber-400 transition">${r.title}</h3>
    <p class="text-xs text-slate-400 leading-relaxed">${r.desc}</p>
  </a>
`).join('');
</script>
</body>
</html>
