<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الادمن </title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen pb-20">

<main class="max-w-7xl mx-auto p-4 lg:p-8 space-y-6">

  <div class="card p-6 flex flex-col lg:flex-row items-start lg:items-center justify-between gap-4">
    <div>
      <span class="px-2.5 py-0.5 bg-amber-500/20 text-amber-400 text-xs font-bold rounded-md border border-amber-500/30">لوحة تحكم المدير والإدارة الإستراتيجية</span>
      <h2 class="text-xl font-bold text-white flex items-center gap-2 mt-1.5">🏢 خريطة الصالات الحية، أمان QR وإدارة المنيو والإعدادات</h2>
    </div>
    <div class="flex flex-wrap gap-2 bg-slate-950 p-1.5 rounded-2xl border border-slate-800" id="adminTabs">
      <button data-tab="floorplan" class="tab-btn px-3 py-1.5 rounded-xl text-xs font-bold transition bg-amber-600 text-white">خريطة </button>
      <button data-tab="menu" class="tab-btn px-3 py-1.5 rounded-xl text-xs font-bold transition text-slate-400">menu</button>
      <button data-tab="settings" class="tab-btn px-3 py-1.5 rounded-xl text-xs font-bold transition text-slate-400">الإعدادات</button>
      <button data-tab="qrlogs" class="tab-btn px-3 py-1.5 rounded-xl text-xs font-bold transition text-slate-400">سجل QR</button>
      <button data-tab="staff" class="tab-btn px-3 py-1.5 rounded-xl text-xs font-bold transition text-slate-400">👤 الموظفون</button>
      <button data-tab="history" class="tab-btn px-3 py-1.5 rounded-xl text-xs font-bold transition text-slate-400">📜 سجل الطلبات</button>
    </div>
  </div>

  <!-- Stats -->
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4" id="statsBox"></div>

  <div id="tabContent"></div>
</main>

<!-- 🖨️ نافذة طباعة كود QR للطاولة -->
<div id="qrPrintModal" class="fixed inset-0 z-[9998] bg-black/70 items-center justify-center p-4 flex-col gap-4" style="display:none">
  <div class="bg-white text-slate-900 rounded-2xl p-8 max-w-xs w-full text-center space-y-3" id="qrPrintCard">
    <h3 class="font-extrabold text-lg" id="qrPrintTitle">طاولة #</h3>
    <div class="flex justify-center"><img id="qrPrintImg" src="" alt="QR" width="240" height="240" class="rounded-lg"></div>
    <p class="text-[11px] text-slate-500">امسح الكود لبدء طلبك</p>
    <p class="text-[10px] text-slate-400 font-mono" id="qrPrintManualCode"></p>
  </div>
  <div id="qrPrintWarning" class="no-print max-w-xs bg-amber-500/20 border border-amber-500/40 text-amber-200 text-[11px] rounded-xl p-3 text-center" style="display:none"></div>
  <p class="no-print max-w-xs text-[10px] text-slate-300 font-mono break-all text-center" id="qrPrintLinkText"></p>
  <div class="flex gap-2 no-print">
    <button id="qrPrintNowBtn" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl">🖨️ طباعة</button>
    <button id="qrPrintCloseBtn" class="px-5 py-2.5 bg-slate-700 hover:bg-slate-600 text-white font-bold text-xs rounded-xl">إغلاق</button>
  </div>
</div>
<style>
@media print {
  body * { visibility: hidden; }
  #qrPrintModal, #qrPrintModal * { visibility: visible; }
  #qrPrintModal { position: fixed; inset: 0; background: white !important; display: flex !important; }
  .no-print { display: none !important; }
}
</style>

<script src="js/config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/state-machine.js"></script>
<script src="js/qr-engine.js"></script>
<script src="js/nav.js"></script>
<script src="js/auth-gate.js"></script>
<script>
requireStaffAuth('ADMIN', () => {
renderNav('admin.html');
renderFooter();

let activeTab = 'floorplan';
let tables = [], menuItems = [], categories = [], orders = [], qrLogs = [], profiles = [], halls = [], trustedDevices = [], settings = null;
let editingItemId = null;
let dishFormMode = null; // null | 'new' | 'edit'
let dishEditingId = null;
let hallFormMode = null; // null | 'new' (إدارة القاعات - إضافة)
let addTableForHallId = null; // معرّف القاعة التي يظهر فيها نموذج "إضافة طاولة" حالياً
let hallPasswordFormId = null; // معرّف القاعة التي يظهر فيها نموذج "كلمة مرور الشاشة" حالياً

document.getElementById('adminTabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab-btn'); if (!btn) return;
  activeTab = btn.dataset.tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.className = 'tab-btn px-3 py-1.5 rounded-xl text-xs font-bold transition text-slate-400');
  btn.className = 'tab-btn px-3 py-1.5 rounded-xl text-xs font-bold transition bg-amber-600 text-white';
  renderTab();
});

const TABLE_COLORS = {
  AVAILABLE: 'bg-emerald-500/20 border-emerald-500 text-emerald-300',
  OCCUPIED: 'bg-rose-500/20 border-rose-500 text-rose-300',
  PAYMENT_PENDING: 'bg-amber-500/20 border-amber-500 text-amber-300',
  RESERVED: 'bg-indigo-500/20 border-indigo-500 text-indigo-300',
  DIRTY_CLEANING: 'bg-blue-500/20 border-blue-500 text-blue-300',
  BLOCKED_MAINTENANCE: 'bg-slate-800 border-slate-700 text-slate-500'
};
const TABLE_LABELS = {
  AVAILABLE: 'شاغرة وجاهزة', OCCUPIED: 'مشغولة (زبائن)', PAYMENT_PENDING: 'بانتظار المحاسبة',
  RESERVED: 'محجوزة مسبقاً', DIRTY_CLEANING: 'قيد التنظيف', BLOCKED_MAINTENANCE: 'معطلة/صيانة'
};

function renderStats() {
  // 🗑️ حُذفت بطاقات الإيرادات من هنا بناءً على طلبك (كانت غير دقيقة) - المبلغ الإجمالي الموثوق
  // الآن يظهر فقط أعلى كل قائمة في تبويب "سجل الطلبات" (اليوم / السابقة / الأرشيف) حسب ما طلبت تحديداً
  const occupied = tables.filter(t => t.status === 'OCCUPIED' || t.status === 'PAYMENT_PENDING').length;
  const occupancyRate = tables.length ? Math.round((occupied / tables.length) * 100) : 0;
  const activeOrders = orders.filter(o => !['COMPLETED', 'CANCELLED'].includes(o.status)).length;
  const cards = [
    { label: 'الطلبات النشطة الآن', value: activeOrders, icon: '📋', color: 'sky' },
    { label: 'الطاولات المشغولة الآن', value: `${occupied} / ${tables.length}`, icon: '🪑', color: 'violet' },
    { label: 'نسبة الإشغال', value: `${occupancyRate}%`, icon: '📊', color: 'amber' }
  ];
  document.getElementById('statsBox').innerHTML = cards.map(c => `
    <div class="card p-4">
      <div class="flex items-center justify-between mb-2"><span class="text-xl">${c.icon}</span><span class="text-[10px] text-${c.color}-400 font-bold">${c.label}</span></div>
      <div class="text-xl font-extrabold text-white font-mono">${c.value}</div>
    </div>`).join('');
}

function renderTab() {
  const box = document.getElementById('tabContent');
  if (activeTab === 'floorplan') box.innerHTML = floorplanHtml();
  else if (activeTab === 'menu') box.innerHTML = menuAdminHtml();
  else if (activeTab === 'settings') box.innerHTML = settingsHtml();
  else if (activeTab === 'qrlogs') box.innerHTML = qrLogsHtml();
  else if (activeTab === 'staff') box.innerHTML = staffHtml();
  else if (activeTab === 'history') box.innerHTML = historyHtml();
  attachTabEvents();
}

// ---------------- Floorplan (القاعات + الطاولات: إنشاء/تعديل/حذف) ----------------
function floorplanHtml() {
  return `<div class="space-y-6">
    <div class="card p-5 flex items-center justify-between gap-3">
      <h3 class="font-bold text-sm text-white">🏛️ القاعات (${halls.length})</h3>
      <button id="newHallBtn" class="px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold text-[11px] rounded-lg transition">➕ إضافة قاعة جديدة</button>
    </div>
    ${hallFormMode === 'new' ? newHallFormHtml() : ''}
    ${halls.map(h => hallSectionHtml(h)).join('')}
    ${unassignedTablesHtml()}
  </div>`;
}

function newHallFormHtml() {
  return `<div class="card p-5 space-y-3">
    <h4 class="font-bold text-sm text-white">قاعة جديدة</h4>
    <input id="newHallName" placeholder="اسم القاعة *" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white">
    <div class="flex gap-2">
      <button id="saveHallBtn" class="flex-1 py-2 bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold text-xs rounded-lg">➕ إنشاء القاعة</button>
      <button id="cancelHallBtn" class="px-3 py-2 bg-slate-800 text-slate-300 font-bold text-xs rounded-lg">إلغاء</button>
    </div>
  </div>`;
}

function hallSectionHtml(h) {
  const hallTables = tables.filter(t => t.hall_id === h.id);
  return `<div class="card p-6 space-y-4">
    <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 pb-3">
      <div>
        <h4 class="font-bold text-sm text-amber-400">${h.name}</h4>
        <div class="text-[10px] text-slate-500">${hallTables.length} طاولة</div>
      </div>
      <div class="flex flex-wrap gap-2">
        <button data-id="${h.id}" class="add-table-btn px-2.5 py-1 bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold text-[10px] rounded-lg transition">➕ إضافة طاولة</button>
        <button data-id="${h.id}" class="hall-pwd-btn px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold text-[10px] rounded-lg transition">🔑 كلمة مرور الشاشة</button>
        <button data-id="${h.id}" class="regen-hall-qr-btn px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold text-[10px] rounded-lg transition">🔄 QR القاعة</button>
        <button data-id="${h.id}" data-count="${hallTables.length}" class="delete-hall-btn px-2.5 py-1 bg-rose-600/80 hover:bg-rose-500 text-white font-bold text-[10px] rounded-lg transition">🗑️ حذف القاعة</button>
      </div>
    </div>
    <div class="grid sm:grid-cols-2 gap-3">
      <div class="bg-slate-950 p-2 rounded-xl border border-slate-800 font-mono text-amber-300 text-[9px] break-all"><span class="text-slate-400 block text-[8px]">QR Token القاعة:</span>${h.qr_security_token || '—'}</div>
      <div class="bg-slate-950 p-2 rounded-xl border border-slate-800 font-mono text-sky-300 text-[9px] break-all"><span class="text-slate-400 block text-[8px]">الكود اليدوي للقاعة:</span>${h.manual_code || '—'}</div>
    </div>
    ${addTableForHallId === h.id ? addTableFormHtml(h) : ''}
    ${hallPasswordFormId === h.id ? hallPasswordFormHtml(h) : ''}
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">
      ${hallTables.length ? hallTables.map(t => tableCardHtml(t)).join('') : `<div class="col-span-full text-center py-6 text-slate-500 text-xs">لا توجد طاولات في هذه القاعة بعد</div>`}
    </div>
  </div>`;
}

function addTableFormHtml(h) {
  return `<div class="bg-slate-950 border border-amber-500/30 rounded-xl p-4 space-y-2">
    <div class="grid grid-cols-2 gap-2">
      <input id="newTableNumber" type="number" placeholder="رقم الطاولة *" class="bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white">
      <input id="newTableCapacity" type="number" value="4" placeholder="السعة" class="bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white">
    </div>
    <div class="flex gap-2">
      <button data-id="${h.id}" class="save-table-btn flex-1 py-2 bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold text-xs rounded-lg">➕ إضافة الطاولة إلى "${h.name}"</button>
      <button id="cancelTableBtn" class="px-3 py-2 bg-slate-800 text-slate-300 font-bold text-xs rounded-lg">إلغاء</button>
    </div>
  </div>`;
}

function hallPasswordFormHtml(h) {
  return `<div class="bg-slate-950 border border-amber-500/30 rounded-xl p-4 space-y-2">
    <input id="hallNewPassword" type="text" placeholder="كلمة مرور جديدة لشاشة قاعة ${h.name} (4 خانات على الأقل)" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white" dir="ltr">
    <div class="flex gap-2">
      <button data-id="${h.id}" class="save-hall-pwd-btn flex-1 py-2 bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold text-xs rounded-lg">💾 حفظ كلمة المرور</button>
      <button id="cancelHallPwdBtn" class="px-3 py-2 bg-slate-800 text-slate-300 font-bold text-xs rounded-lg">إلغاء</button>
    </div>
  </div>`;
}

function tableCardHtml(t) {
  return `<div class="p-4 rounded-2xl border text-center space-y-2 ${TABLE_COLORS[t.status]}">
    <div class="font-bold text-lg font-mono">طاولة #${t.number}</div>
    <div class="text-[10px] font-bold">${TABLE_LABELS[t.status]}</div>
    <div class="bg-slate-950/80 p-2 rounded-xl text-[9px] font-mono break-all text-amber-300 border border-slate-800">
      <span class="text-slate-400 block text-[8px]">Secret Token:</span>${t.qr_security_token}
    </div>
    <div class="bg-slate-950/80 p-2 rounded-xl text-[9px] font-mono break-all text-sky-300 border border-slate-800">
      <span class="text-slate-400 block text-[8px]">الكود اليدوي:</span>${t.manual_code || '—'}
    </div>
    <div class="space-y-1 pt-1">
      <button data-id="${t.id}" class="regen-qr-btn w-full py-1 bg-slate-800 hover:bg-slate-700 text-amber-400 font-bold text-[10px] rounded-lg transition">🔄 توليد QR جديد</button>
      <button data-id="${t.id}" data-number="${t.number}" data-token="${t.qr_security_token}" class="print-qr-btn w-full py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-[10px] rounded-lg transition">🖨️ طباعة QR الطاولة</button>
      <button data-id="${t.id}" class="regen-code-btn w-full py-1 bg-slate-800 hover:bg-slate-700 text-sky-400 font-bold text-[10px] rounded-lg transition">🔄 توليد كود يدوي جديد</button>
      ${t.status === 'DIRTY_CLEANING' ? `<button data-id="${t.id}" data-status="AVAILABLE" class="table-status-btn w-full py-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-[10px] rounded-lg transition">✅ تأكيد النظافة</button>` : ''}
      ${t.status === 'AVAILABLE' ? `<button data-id="${t.id}" data-status="BLOCKED_MAINTENANCE" class="table-status-btn w-full py-1 bg-slate-700 hover:bg-slate-600 text-white font-bold text-[10px] rounded-lg transition">🔧 وضع صيانة</button>` : ''}
      ${t.status === 'BLOCKED_MAINTENANCE' ? `<button data-id="${t.id}" data-status="AVAILABLE" class="table-status-btn w-full py-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-[10px] rounded-lg transition">✅ إنهاء الصيانة</button>` : ''}
      ${t.status === 'AVAILABLE' ? `<button data-id="${t.id}" data-number="${t.number}" class="delete-table-btn w-full py-1 bg-rose-600/80 hover:bg-rose-500 text-white font-bold text-[10px] rounded-lg transition">🗑️ حذف الطاولة</button>` : ''}
    </div>
  </div>`;
}

function unassignedTablesHtml() {
  const orphan = tables.filter(t => !halls.some(h => h.id === t.hall_id));
  if (!orphan.length) return '';
  return `<div class="card p-6 space-y-3">
    <h4 class="font-bold text-sm text-rose-400 border-b border-slate-800 pb-2">⚠️ طاولات بلا قاعة مسجّلة رسمياً (${orphan.length})</h4>
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">${orphan.map(t => tableCardHtml(t)).join('')}</div>
  </div>`;
}

async function createHall() {
  const name = document.getElementById('newHallName').value.trim();
  if (!name) { showToast('أدخل اسم القاعة', 'error'); return; }
  const saved = await insertRow('halls', { id: genId('hall'), name });
  if (!saved) return;
  await addAuditLog('HALL_CREATED', 'ADMIN', `إنشاء قاعة جديدة: ${name}`);
  showToast('تم إنشاء القاعة (تم توليد QR وكود يدوي لها تلقائياً)', 'success');
  hallFormMode = null;
  loadAll();
}

async function deleteHall(hallId, tableCount) {
  if (tableCount > 0) { showToast('لا يمكن حذف قاعة تحتوي على طاولات - احذف أو انقل طاولاتها أولاً', 'error'); return; }
  if (!confirm('هل أنت متأكد من حذف هذه القاعة نهائياً؟')) return;
  const ok = await deleteRow('halls', 'id', hallId);
  if (!ok) return;
  await addAuditLog('HALL_DELETED', 'ADMIN', `حذف القاعة ${hallId}`);
  showToast('تم حذف القاعة', 'success');
  loadAll();
}

async function regenerateHallQR(hallId) {
  const token = `QR-HALL-${hallId}-${Math.random().toString(36).substring(2, 18).toUpperCase()}`;
  await updateRow('halls', 'id', hallId, { qr_security_token: token, token_created_at: new Date().toISOString() });
  await addAuditLog('HALL_QR_REGENERATED', 'ADMIN', `تجديد رمز QR للقاعة ${hallId}`);
  showToast('تم توليد رمز QR جديد للقاعة', 'success');
  loadAll();
}

async function saveHallPassword(hallId) {
  const pwd = document.getElementById('hallNewPassword').value;
  if (!pwd || pwd.length < 4) { showToast('كلمة المرور قصيرة جداً (4 خانات على الأقل)', 'error'); return; }
  const { data, error } = await supabaseClient.rpc('set_hall_screen_password_secure', { p_hall_id: hallId, p_new_password: pwd });
  if (error) console.error('set_hall_screen_password_secure', error);
  if (error || !data || !data.isValid) { showToast(friendlyRpcError(error) || (data && data.message) || 'تعذر حفظ كلمة المرور', 'error'); return; }
  await addAuditLog('HALL_SCREEN_PASSWORD_UPDATED', 'ADMIN', `تحديث كلمة مرور شاشة القاعة ${hallId}`);
  showToast('تم تحديث كلمة مرور شاشة القاعة', 'success');
  hallPasswordFormId = null;
  renderTab();
}

async function addTableToHall(hallId) {
  const hall = halls.find(h => h.id === hallId);
  const number = +document.getElementById('newTableNumber').value;
  const capacity = +document.getElementById('newTableCapacity').value || 4;
  if (!number) { showToast('أدخل رقم الطاولة', 'error'); return; }
  if (tables.some(t => t.number === number)) { showToast('رقم الطاولة هذا مستخدم بالفعل', 'error'); return; }
  const saved = await insertRow('tables', {
    id: genId('tbl'), number, hall_id: hallId, hall_name: hall.name, capacity, status: 'AVAILABLE',
    qr_security_token: generateRandomSecretToken(number),
    manual_code: `TBL${number}-${Math.random().toString(36).substring(2, 7).toUpperCase()}`
  });
  if (!saved) return;
  await addAuditLog('TABLE_ADDED', 'ADMIN', `إضافة طاولة جديدة #${number} إلى قاعة ${hall.name}`);
  showToast(`تمت إضافة الطاولة #${number}`, 'success');
  addTableForHallId = null;
  loadAll();
}

async function deleteTable(tableId, number) {
  if (!confirm(`هل أنت متأكد من حذف الطاولة #${number} نهائياً؟`)) return;
  const ok = await deleteRow('tables', 'id', tableId);
  if (!ok) return;
  await addAuditLog('TABLE_DELETED', 'ADMIN', `حذف الطاولة #${number}`);
  showToast(`تم حذف الطاولة #${number}`, 'success');
  loadAll();
}

async function regenerateTableQR(tableId) {
  const table = tables.find(t => t.id === tableId);
  const renewed = createNewTableToken(table);
  await updateRow('tables', 'id', tableId, { qr_security_token: renewed.qr_security_token, token_created_at: renewed.token_created_at });
  await addAuditLog('QR_REGENERATED', 'ADMIN', `تجديد رمز QR للطاولة #${table.number} يدوياً`);
  showToast('تم توليد رمز QR جديد للطاولة', 'success');
  loadAll();
}

// 🖨️ فتح نافذة طباعة كود QR الخاص بالطاولة - يُطبع رابط menu.html?table=N&token=TOKEN كصورة QR فعلية قابلة للمسح
// (نعتمد صورة جاهزة من خدمة توليد QR خارجية - أبسط وأوثق من مكتبة JS قد تفشل بالتحميل صامتة)
function openQrPrintModal(number, token) {
  const table = tables.find(t => t.number === number);
  // 🆕 نستخدم الرابط العام المحفوظ من الإعدادات إن وُجد (هذا ما يجعل الكود يعمل من أي هاتف آخر)،
  // وإلا نرجع للرابط الحالي في المتصفح كحل احتياطي مع تنبيه صريح لضبطه من الإعدادات
  let base = settings && settings.public_base_url;
  if (!base) {
    base = `${window.location.origin}${window.location.pathname.replace(/admin\.html$/, '')}`;
  }
  const url = `${base}menu.html?table=${number}&token=${encodeURIComponent(token)}`;
  document.getElementById('qrPrintTitle').textContent = `طاولة #${number}`;
  document.getElementById('qrPrintManualCode').textContent = table && table.manual_code ? `أو الكود اليدوي: ${table.manual_code}` : '';
  document.getElementById('qrPrintImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=260x260&margin=8&data=${encodeURIComponent(url)}`;

async function regenerateTableManualCode(tableId) {
  const table = tables.find(t => t.id === tableId);
  const newCode = `TBL${table.number}-${Math.random().toString(36).substring(2, 7).toUpperCase()}`;
  await updateRow('tables', 'id', tableId, { manual_code: newCode });
  await addAuditLog('TABLE_MANUAL_CODE_REGENERATED', 'ADMIN', `تجديد الكود اليدوي للطاولة #${table.number}`);
  showToast('تم توليد كود يدوي جديد للطاولة', 'success');
  loadAll();
}

async function changeTableStatus(tableId, nextStatus) {
  const table = tables.find(t => t.id === tableId);
  try { validateTableTransition(table.status, nextStatus); } catch (err) { showToast(err.message, 'error'); return; }
  const patch = { status: nextStatus };
  if (nextStatus === 'AVAILABLE') {
    // 🆕 إنهاء أي جلسة (table_sessions) عالقة صراحة، وإلا تبقى الجلسة القديمة "ACTIVE" وتمنع دخول زبون جديد
    Object.assign(patch, { current_order_id: null, current_session_id: null });
    await supabaseClient.from('table_sessions').update({ status: 'EXPIRED', ended_at: new Date().toISOString() })
      .eq('table_number', table.number).eq('status', 'ACTIVE');
  }
  await updateRow('tables', 'id', tableId, patch);
  await addAuditLog('TABLE_STATUS_CHANGE', 'ADMIN', `تغيير حالة الطاولة #${table.number} إلى ${nextStatus}`);
  loadAll();
}

async function uploadDishImage(file) {
  if (file.size > 5 * 1024 * 1024) { showToast('الصورة كبيرة جداً - الحد الأقصى 5 ميغابايت', 'error'); return null; }
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const path = `dishes/${Date.now()}-${Math.random().toString(36).substring(2, 8)}.${ext}`;
  const { error } = await supabaseClient.storage.from('dish-images').upload(path, file, { upsert: false, cacheControl: '3600' });
  if (error) { showToast('تعذّر رفع الصورة: ' + (error.message || 'خطأ غير معروف'), 'error'); return null; }
  const { data } = supabaseClient.storage.from('dish-images').getPublicUrl(path);
  return data.publicUrl;
}

async function saveDish() {
  const name = document.getElementById('dishName').value.trim();
  const category = document.getElementById('dishCategory').value;
  const price = +document.getElementById('dishPrice').value || 0;
  let image = document.getElementById('dishImage').value.trim();
  const description = document.getElementById('dishDescription').value.trim();
  const notes = document.getElementById('dishNotes').value.trim();
  if (!name || !price) { showToast('يرجى إدخال اسم الطبق وسعره على الأقل', 'error'); return; }
  if (!category) { showToast('أضف صنفاً واحداً على الأقل قبل إضافة طبق', 'error'); return; }

  const fileInput = document.getElementById('dishImageFile');
  const saveBtn = document.getElementById('saveDishBtn');
  if (fileInput && fileInput.files && fileInput.files[0]) {
    const originalLabel = saveBtn.textContent;
    saveBtn.textContent = '⏳ جاري رفع الصورة...'; saveBtn.disabled = true;
    const uploadedUrl = await uploadDishImage(fileInput.files[0]);
    saveBtn.textContent = originalLabel; saveBtn.disabled = false;
    if (!uploadedUrl) return; // فشل الرفع - لا نكمل الحفظ
    image = uploadedUrl;
  }

  if (dishFormMode === 'edit') {
    await updateRow('menu_items', 'id', dishEditingId, { name, category, price, image, description, notes });
    await addAuditLog('DISH_UPDATED', 'ADMIN', `تعديل بيانات الطبق: ${name}`);
    showToast('تم حفظ تعديلات الطبق', 'success');
  } else {
    await insertRow('menu_items', { id: genId('dish'), name, category, price, image, description, notes, is_available: true, custom_addons: [] });
    await addAuditLog('DISH_ADDED', 'ADMIN', `إضافة طبق جديد: ${name}`);
    showToast('تمت إضافة الطبق الجديد', 'success');
  }
  dishFormMode = null; dishEditingId = null;
  loadAll();
}

async function deleteDish(id, name) {
  if (!confirm(`حذف الطبق "${name}" نهائياً من المنيو؟ لا يمكن التراجع.`)) return;
  const ok = await deleteRow('menu_items', 'id', id);
  if (!ok) return;
  await addAuditLog('DISH_DELETED', 'ADMIN', `حذف الطبق: ${name}`);

  if (dishEditingId === id) { dishFormMode = null; dishEditingId = null; }

}

let historyFilter = 'today'; // today | previous | archived
let historySelected = new Set();

function isToday(dateStr) {
  const d = new Date(dateStr), now = new Date();
  return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
}

function getHistoryOrders() {
  const closed = orders.filter(o => ['COMPLETED','CANCELLED'].includes(o.status));
  if (historyFilter === 'today') return closed.filter(o => isToday(o.created_at) && !o.is_archived);
  if (historyFilter === 'previous') return closed.filter(o => !isToday(o.created_at) && !o.is_archived);
  return closed.filter(o => o.is_archived); // archived
}

function exportHistoryToExcel() {
  const list = getHistoryOrders();
  if (!list.length) { showToast('لا توجد طلبات لتصديرها في هذا القسم', 'error'); return; }
  const rows = list.map(o => ({
    'رقم الطلب': o.order_number, 'الطاولة': o.table_number || '-', 'الحالة': o.status === 'COMPLETED' ? 'مكتمل' : 'ملغى',
    'حالة الدفع': o.payment_status, 'طريقة الدفع': o.payment_method || '-', 'المبلغ (د.ج)': o.total_amount,
    'عدد الأصناف': (o.items || []).length, 'التاريخ والوقت': new Date(o.created_at).toLocaleString('ar-DZ')
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'الطلبات');
  const fname = `طلبات-${historyFilter === 'today' ? 'اليوم' : historyFilter === 'previous' ? 'سابقة' : 'الأرشيف'}-${new Date().toISOString().slice(0,10)}.xlsx`;
  XLSX.writeFile(wb, fname);
}

async function archiveSelected() {
  if (!historySelected.size) { showToast('اختر طلباً واحداً على الأقل', 'error'); return; }
  for (const id of historySelected) await updateRow('orders', 'id', id, { is_archived: true, archived_at: new Date().toISOString() });
  await addAuditLog('ORDERS_ARCHIVED', 'ADMIN', `أرشفة ${historySelected.size} طلب`);
  showToast('تمت الأرشفة بنجاح', 'success');
  historySelected.clear();
  loadAll();
}

async function deleteSelectedHistory() {
  if (!historySelected.size) { showToast('اختر طلباً واحداً على الأقل', 'error'); return; }
  if (!confirm(`حذف ${historySelected.size} طلب نهائياً؟ لا يمكن التراجع عن هذا الإجراء.`)) return;
  for (const id of historySelected) await deleteRow('orders', 'id', id);
  await addAuditLog('ORDERS_DELETED', 'ADMIN', `حذف ${historySelected.size} طلب نهائياً`);
  showToast('تم الحذف بنجاح', 'success');
  historySelected.clear();
  loadAll();
}

  document.querySelectorAll('.regen-code-btn').forEach(b => b.onclick = () => regenerateTableManualCode(b.dataset.id));
  document.querySelectorAll('.table-status-btn').forEach(b => b.onclick = () => changeTableStatus(b.dataset.id, b.dataset.status));
  document.querySelectorAll('.delete-table-btn').forEach(b => b.onclick = () => deleteTable(b.dataset.id, b.dataset.number));
  const newHallBtn = document.getElementById('newHallBtn'); if (newHallBtn) newHallBtn.onclick = () => { hallFormMode = 'new'; renderTab(); };
  const saveHallBtn = document.getElementById('saveHallBtn'); if (saveHallBtn) saveHallBtn.onclick = createHall;
  const cancelHallBtn = document.getElementById('cancelHallBtn'); if (cancelHallBtn) cancelHallBtn.onclick = () => { hallFormMode = null; renderTab(); };
  document.querySelectorAll('.add-table-btn').forEach(b => b.onclick = () => { addTableForHallId = b.dataset.id; hallPasswordFormId = null; renderTab(); });
  document.querySelectorAll('.save-table-btn').forEach(b => b.onclick = () => addTableToHall(b.dataset.id));
  const cancelTableBtn = document.getElementById('cancelTableBtn'); if (cancelTableBtn) cancelTableBtn.onclick = () => { addTableForHallId = null; renderTab(); };
  document.querySelectorAll('.hall-pwd-btn').forEach(b => b.onclick = () => { hallPasswordFormId = b.dataset.id; addTableForHallId = null; renderTab(); });
  document.querySelectorAll('.save-hall-pwd-btn').forEach(b => b.onclick = () => saveHallPassword(b.dataset.id));
  const cancelHallPwdBtn = document.getElementById('cancelHallPwdBtn'); if (cancelHallPwdBtn) cancelHallPwdBtn.onclick = () => { hallPasswordFormId = null; renderTab(); };
  document.querySelectorAll('.regen-hall-qr-btn').forEach(b => b.onclick = () => regenerateHallQR(b.dataset.id));
  document.querySelectorAll('.delete-hall-btn').forEach(b => b.onclick = () => deleteHall(b.dataset.id, +b.dataset.count));
  document.querySelectorAll('.edit-item-btn').forEach(b => b.onclick = () => { editingItemId = b.dataset.id; dishFormMode = null; renderTab(); });
  document.querySelectorAll('.edit-dish-btn').forEach(b => b.onclick = () => { dishFormMode = 'edit'; dishEditingId = b.dataset.id; editingItemId = null; renderTab(); });
  document.querySelectorAll('.toggle-avail-btn').forEach(b => b.onclick = () => toggleAvailability(b.dataset.id, b.dataset.avail === 'true'));
  document.querySelectorAll('.remove-addon-btn').forEach(b => b.onclick = () => removeAddon(b.dataset.item, b.dataset.addon));
  document.querySelectorAll('.delete-dish-btn').forEach(b => b.onclick = () => deleteDish(b.dataset.id, b.dataset.name));
  document.querySelectorAll('.delete-category-btn').forEach(b => b.onclick = () => deleteCategory(b.dataset.id, b.dataset.key, b.dataset.label));
  const addCategoryBtn = document.getElementById('addCategoryBtn'); if (addCategoryBtn) addCategoryBtn.onclick = addCategory;
  const addBtn = document.getElementById('addAddonBtn'); if (addBtn) addBtn.onclick = () => addAddon(editingItemId);
  const newDishBtn = document.getElementById('newDishBtn'); if (newDishBtn) newDishBtn.onclick = () => { dishFormMode = 'new'; dishEditingId = null; editingItemId = null; renderTab(); };
  const saveDishBtn = document.getElementById('saveDishBtn'); if (saveDishBtn) saveDishBtn.onclick = saveDish;
  const cancelDishBtn = document.getElementById('cancelDishBtn'); if (cancelDishBtn) cancelDishBtn.onclick = () => { dishFormMode = null; dishEditingId = null; renderTab(); };
  const dishImageFile = document.getElementById('dishImageFile');
  if (dishImageFile) dishImageFile.onchange = () => {
    const file = dishImageFile.files[0];
    const preview = document.getElementById('dishImagePreview');
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => { preview.src = e.target.result; preview.classList.remove('hidden'); };
    reader.readAsDataURL(file);
  };
  document.querySelectorAll('.mode-btn').forEach(b => b.onclick = () => {
    const patch = { operating_mode: b.dataset.mode };
    updateSettings(patch);
  });
  document.querySelectorAll('.policy-btn').forEach(b => b.onclick = () => updateSettings({ payment_policy: b.dataset.policy }));
  const saveTimeout = document.getElementById('saveTimeoutBtn');
  if (saveTimeout) saveTimeout.onclick = () => updateSettings({ session_timeout_minutes: +document.getElementById('sessionTimeoutInput').value });
  const saveSecChecks = document.getElementById('saveSecurityChecksBtn');
  if (saveSecChecks) saveSecChecks.onclick = () => updateSettings({
    enable_gps_check: document.getElementById('gpsCheckToggle').checked,
    enable_wifi_check: document.getElementById('wifiCheckToggle').checked
  });
  const useMyLocationBtn = document.getElementById('useMyLocationBtn');
  if (useMyLocationBtn) useMyLocationBtn.onclick = () => {
    if (!navigator.geolocation) { showToast('المتصفح لا يدعم تحديد الموقع', 'error'); return; }
    useMyLocationBtn.textContent = '📡 جارٍ تحديد موقعك...';
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        document.getElementById('restaurantLat').value = pos.coords.latitude;
        document.getElementById('restaurantLng').value = pos.coords.longitude;
        useMyLocationBtn.textContent = '📡 استخدام موقعي الحالي';
        showToast('تم تحديد موقعك - اضغط "حفظ الموقع" لتثبيته', 'success');
      },
      (err) => {
        useMyLocationBtn.textContent = '📡 استخدام موقعي الحالي';
        showToast('تعذر تحديد موقعك: ' + (err.message || 'تأكد من إذن الموقع في المتصفح'), 'error');
      }
    );
  };
  const saveGpsBtn = document.getElementById('saveGpsBtn');
  if (saveGpsBtn) saveGpsBtn.onclick = () => {
    const lat = +document.getElementById('restaurantLat').value;
    const lng = +document.getElementById('restaurantLng').value;
    const radius = +document.getElementById('restaurantGpsRadius').value || 200;
    if (!lat || !lng) { showToast('أدخل خط العرض وخط الطول، أو استخدم زر "موقعي الحالي"', 'error'); return; }
    updateSettings({ restaurant_lat: lat, restaurant_lng: lng, gps_radius_meters: radius, gps_updated_at: new Date().toISOString() });
  };
  const useCurrentUrlBtn = document.getElementById('useCurrentUrlBtn');
  if (useCurrentUrlBtn) useCurrentUrlBtn.onclick = () => {
    document.getElementById('publicBaseUrlInput').value = `${window.location.origin}${window.location.pathname.replace(/admin\.html$/, '')}`;
  };
  const saveBaseUrlBtn = document.getElementById('saveBaseUrlBtn');
  if (saveBaseUrlBtn) saveBaseUrlBtn.onclick = () => {
    let val = document.getElementById('publicBaseUrlInput').value.trim();
    if (!val) { showToast('أدخل الرابط العام أولاً', 'error'); return; }
    if (!/^https?:\/\//i.test(val)) { showToast('الرابط يجب أن يبدأ بـ http:// أو https://', 'error'); return; }
    if (!val.endsWith('/')) val += '/';
    updateSettings({ public_base_url: val });
  };
  const saveCustomCodeBtn = document.getElementById('saveCustomCodeBtn');
  if (saveCustomCodeBtn) saveCustomCodeBtn.onclick = () => {
    const val = document.getElementById('customRestaurantCode').value.trim();
    if (!val) { showToast('أدخل كوداً أولاً', 'error'); return; }
    updateSettings({ restaurant_qr_token: val });
  };
  const regenRestaurantQrBtn = document.getElementById('regenRestaurantQrBtn');
  if (regenRestaurantQrBtn) regenRestaurantQrBtn.onclick = () => {
    const newToken = `QR-RESTAURANT-${Math.random().toString(36).substring(2, 22).toUpperCase()}`;
    updateSettings({ restaurant_qr_token: newToken });
  };
  const saveManualCodeBtn = document.getElementById('saveManualCodeBtn');
  if (saveManualCodeBtn) saveManualCodeBtn.onclick = () => {
    const val = document.getElementById('customManualCode').value.trim();
    if (!val) { showToast('أدخل كوداً أولاً', 'error'); return; }
    updateSettings({ customer_manual_code: val, customer_manual_code_updated_at: new Date().toISOString() });
  };
  const regenManualCodeBtn = document.getElementById('regenManualCodeBtn');
  if (regenManualCodeBtn) regenManualCodeBtn.onclick = () => {
    const newCode = `CODE-${Math.random().toString(36).substring(2, 8).toUpperCase()}`;
    updateSettings({ customer_manual_code: newCode, customer_manual_code_updated_at: new Date().toISOString() });
  };
  document.querySelectorAll('.save-profile-btn').forEach(b => b.onclick = () => saveProfile(b.dataset.id));
  document.querySelectorAll('.revoke-device-btn').forEach(b => b.onclick = () => revokeTrustedDevice(b.dataset.id));
  document.querySelectorAll('.history-filter-btn').forEach(b => b.onclick = () => { historyFilter = b.dataset.filter; historySelected.clear(); renderTab(); });
  document.querySelectorAll('.history-select').forEach(b => b.onchange = () => { if (b.checked) historySelected.add(b.dataset.id); else historySelected.delete(b.dataset.id); });
  const selectAllBox = document.getElementById('historySelectAll');
  if (selectAllBox) selectAllBox.onchange = () => {
    document.querySelectorAll('.history-select').forEach(b => { b.checked = selectAllBox.checked; if (selectAllBox.checked) historySelected.add(b.dataset.id); else historySelected.delete(b.dataset.id); });
  };
  document.querySelectorAll('.history-toggle-btn').forEach(b => b.onclick = () => {
    const panel = document.getElementById(`history-details-${b.dataset.toggle}`);
    const open = !panel.classList.contains('hidden');
    panel.classList.toggle('hidden');
    b.textContent = open ? 'تفاصيل ▾' : 'إخفاء ▴';
  });
  const exportBtn = document.getElementById('exportExcelBtn'); if (exportBtn) exportBtn.onclick = exportHistoryToExcel;
  const archiveBtn = document.getElementById('archiveSelectedBtn'); if (archiveBtn) archiveBtn.onclick = archiveSelected;
  const deleteHistBtn = document.getElementById('deleteSelectedBtn'); if (deleteHistBtn) deleteHistBtn.onclick = deleteSelectedHistory;
}

async function loadAll() {
  tables = await fetchAll('tables', 'number');
  menuItems = await fetchAll('menu_items', 'category');
  categories = await fetchAll('categories', 'sort_order');
  orders = await fetchAllPaginated('orders', 'created_at');
  qrLogs = await fetchAll('qr_access_logs', 'timestamp', false);
  profiles = await fetchAll('profiles', 'created_at');
  halls = await fetchAll('halls', 'name');
  trustedDevices = await fetchAll('trusted_devices', 'created_at', false);
  const { data: s } = await supabaseClient.from('settings').select('*').eq('id', 1).single();
  settings = s;
  renderStats();
  renderTab();
}
loadAll();
subscribeToTable('orders', renderStats);
subscribeToTable('tables', loadAll);

document.getElementById('qrPrintCloseBtn').onclick = () => { document.getElementById('qrPrintModal').style.display = 'none'; };
document.getElementById('qrPrintNowBtn').onclick = () => window.print();
});
</script>
</body>
